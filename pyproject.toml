[project]
name = "pipelines-transcript"
version = "0.3.0"
description = "Extract transcripts from video (MP4) and audio files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.25.7",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
transcript = "video_transcript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_transcript", "configs"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
